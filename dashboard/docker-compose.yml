services:
  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: fence
      POSTGRES_PASSWORD: fence
      POSTGRES_DB: fence
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fence -d fence"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: ["api"]
    environment:
      FENCE_DATABASE_URL: postgresql+asyncpg://fence:fence@db:5432/fence
      FENCE_MQTT_HOST: broker
      FENCE_MQTT_PORT: "1883"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    ports:
      - "8000:8000"

  ingest:
    build: ./backend
    command: ["ingest"]
    environment:
      FENCE_DATABASE_URL: postgresql+asyncpg://fence:fence@db:5432/fence
      FENCE_MQTT_HOST: broker
      FENCE_MQTT_PORT: "1883"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started

  mock-publisher:
    build: ./mock-publisher
    environment:
      FENCE_MQTT_HOST: broker
      FENCE_MQTT_PORT: "1883"
    depends_on:
      broker:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  db-data:
