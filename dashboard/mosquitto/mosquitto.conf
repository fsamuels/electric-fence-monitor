# Dev config. Mosquitto 2.x defaults to allow_anonymous false and a
# localhost-only listener, which silently refuses every connection from
# other containers unless both are overridden explicitly.
#
# Anonymous access is acceptable on a trusted LAN for initial development
# and real-node bring-up. Per-node credentials/ACLs are later hardening
# (see docs/dashboard-plan.md#security), not a D0 or D6 gate.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
